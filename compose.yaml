services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: unahur_tp_backend
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      MONGODB_URI: mongodb://database:27017/unahur-tp
      REDIS_URL: redis://cache:6379

    depends_on:
      - database
      - cache

    volumes:
      - ./backend:/app
      - /app/node_modules

    networks:
      - unahur_network


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: unahur_tp_frontend
    restart: unless-stopped

    ports:
      - "5173:5173"

    depends_on:
      - backend

    volumes:
      - ./frontend:/app
      - /app/node_modules

    networks:
      - unahur_network


  database:
    image: mongo:6-jammy
    container_name: unahur_tp_db
    restart: unless-stopped

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

    networks:
      - unahur_network


  cache:
    image: redis:7-alpine
    container_name: unahur_tp_cache
    restart: unless-stopped

    ports:
      - "6380:6379"

    networks:
      - unahur_network


volumes:
  mongo_data:


networks:
  unahur_network:
    driver: bridge