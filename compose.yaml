# Gradify: todo el proyecto con un comando.
#   docker compose up --build
# Servicios: backend (Express + nodemon, hot-reload) + frontend (Vite dev con
# HMR) + database (MongoDB) + cache (Redis). El código se monta por volumen:
# lo que editás en ./backend y ./frontend se refleja sin rebuild.
# Sin `name:` a propósito: el proyecto por defecto (nombre del directorio)
# reutiliza el volumen mongo_data existente con los datos.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unahur_tp_backend
    restart: unless-stopped
    command: npm run dev -- --legacy-watch

    ports:
      - "127.0.0.1:3000:3000"

    env_file:
      - ./backend/.env

    environment:
      NODE_ENV: development
      PORT: "3000"
      MONGODB_URI: mongodb://database:27017/unahur-tp
      REDIS_URL: redis://cache:6379

    volumes:
      # Código en vivo por bind + dependencias nativas de Linux en volumen
      # nombrado (Docker lo siembra desde la imagen en el primer arranque;
      # sin esto se verían los node_modules de Windows del host y rompe).
      - ./backend:/app
      - backend_modules:/app/node_modules

    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - unahur_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: unahur_tp_frontend
    restart: unless-stopped

    ports:
      - "127.0.0.1:5173:5173"

    environment:
      VITE_API_URL: http://localhost:3000

    volumes:
      # Idem backend: bind de código + volumen para node_modules de Linux.
      - ./frontend:/app
      - frontend_modules:/app/node_modules

    networks:
      - unahur_network

  database:
    image: mongo:6-jammy
    container_name: unahur_tp_db
    restart: unless-stopped

    ports:
      # 27018 en host: el 27017 lo ocupa un mongod local de Windows.
      # Dentro de la red compose sigue siendo 27017 (MONGODB_URI intacto).
      - "127.0.0.1:27018:27017"

    volumes:
      - mongo_data:/data/db

    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.adminCommand({ ping: 1 })"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - unahur_network

  cache:
    image: redis:7-alpine
    container_name: unahur_tp_cache
    restart: unless-stopped

    ports:
      - "127.0.0.1:6380:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - unahur_network

volumes:
  # mongo_data resuelve al volumen existente con los datos
  # (projecto_integrador_aca_unahur_tp_grupal_v_10_mongo_data).
  mongo_data:
  redis_data:
  backend_modules:
  frontend_modules:

networks:
  unahur_network:
    driver: bridge
