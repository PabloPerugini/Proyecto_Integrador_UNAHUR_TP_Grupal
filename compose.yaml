
name: backend

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unahur_tp_app
    restart: unless-stopped

    ports:
      - "127.0.0.1:3000:3000"

    env_file:
      - ./backend/.env

    environment:
      NODE_ENV: development
      PORT: "3000"
      MONGODB_URI: mongodb://database:27017/unahur-tp
      REDIS_URL: redis://cache:6379

    volumes:
      - ./backend:/app
      - node_modules:/app/node_modules

    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy

    networks:
      - unahur_network

  database:
    image: mongo:6-jammy
    container_name: unahur_tp_db
    restart: unless-stopped

    ports:
      - "127.0.0.1:27017:27017"

    volumes:
      - mongo_data:/data/db

    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.adminCommand({ ping: 1 })"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - unahur_network

  cache:
    image: redis:7-alpine
    container_name: unahur_tp_cache
    restart: unless-stopped

    ports:
      - "127.0.0.1:6380:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - unahur_network

volumes:
  mongo_data:
  redis_data:
  node_modules:

networks:
  unahur_network:
    driver: bridge
