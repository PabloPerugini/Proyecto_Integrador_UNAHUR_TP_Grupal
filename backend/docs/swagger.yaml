openapi: 3.0.3
info:
  title: UNAHUR TP - API
  description: |
    API REST del Proyecto Integrador UNAHUR. Documenta usuarios, carreras, plan de
    estudios y progreso de alumnos.

    **Autenticación:** la sesión se maneja con una cookie httpOnly llamada `token`
    (JWT). Al iniciar sesión o registrar un usuario, el servidor la fija
    automáticamente. Para probar los endpoints protegidos, presioná **Authorize**
    en Swagger UI/Redoc y pegá el valor de la cookie `token`.
  version: 2.0.0
servers:
  - url: http://localhost:3000
tags:
  - name: Health
    description: Estado de la API
  - name: Users
    description: Gestión de usuarios y sesión
  - name: Careers
    description: Carreras y plan de estudios
  - name: Progress
    description: Progreso del alumno
security:
  - cookieAuth: []
paths:
  /health:
    get:
      tags:
        - Health
      summary: Verifica que la API esté viva
      security: []
      responses:
        "200":
          description: Servicio OK
          content:
            application/json:
              example:
                status: ok

  /users/login:
    post:
      tags:
        - Users
      summary: Inicia sesión y fija la cookie de sesión
      description: Devuelve el usuario y setea la cookie httpOnly `token`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: "Usuario autenticado (Set-Cookie: token)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Faltan credenciales
        "401":
          description: Contraseña incorrecta
        "404":
          description: Usuario no encontrado

  /users/logout:
    post:
      tags:
        - Users
      summary: Cierra la sesión y limpia la cookie
      security: []
      responses:
        "200":
          description: Sesión cerrada
          content:
            application/json:
              example:
                message: Sesión cerrada

  /users:
    post:
      tags:
        - Users
      summary: Crea un usuario (queda autenticado)
      description: Crea la cuenta y fija la cookie `token` automáticamente.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserBody"
      responses:
        "201":
          description: Usuario creado y autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Validación fallida (Joi)
        "409":
          description: Ya existe una cuenta con ese nickName o email

  /users/me:
    get:
      tags:
        - Users
      summary: Obtiene el usuario de la sesión actual
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Usuario autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: No estás autenticado

  /users/{nickName}:
    get:
      tags:
        - Users
      summary: Obtiene el perfil público de un usuario por nickName
      security: []
      parameters:
        - $ref: "#/components/parameters/nickName"
      responses:
        "200":
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Usuario no encontrado
    put:
      tags:
        - Users
      summary: Actualiza tu propio perfil
      description: Solo podés editar tu propia cuenta.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/nickName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserBody"
      responses:
        "200":
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Validación fallida
        "401":
          description: No estás autenticado
        "403":
          description: Solo podés editar tu propio perfil
        "404":
          description: Usuario no encontrado
    delete:
      tags:
        - Users
      summary: Elimina tu propia cuenta
      description: Solo podés eliminar tu propia cuenta.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/nickName"
      responses:
        "200":
          description: Usuario eliminado (cookie limpiada)
          content:
            application/json:
              example:
                message: Usuario eliminado
        "401":
          description: No estás autenticado
        "403":
          description: Solo podés eliminar tu propio perfil
        "404":
          description: Usuario no encontrado

  /careers:
    get:
      tags:
        - Careers
      summary: Lista las carreras (filtrable por status)
      security: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [draft, published]
      responses:
        "200":
          description: Lista de carreras
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Career"
    post:
      tags:
        - Careers
      summary: Crea una carrera
      description: "Si ya existe una carrera con el mismo nombre (ignorando acentos/mayúsculas), devuelve 200 con `reused: true` en lugar de duplicarla."
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCareerBody"
      responses:
        "200":
          description: "Se reutilizó una carrera existente (reused: true)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Career"
        "201":
          description: Carrera creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Career"
        "400":
          description: El nombre de la carrera es obligatorio
        "401":
          description: No estás autenticado

  /careers/{id}/subjects:
    get:
      tags:
        - Careers
      summary: Lista las materias de una carrera
      security: []
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Lista de materias
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subject"
    post:
      tags:
        - Careers
      summary: Guarda/mergea materias de una carrera
      description: Mergea por nombre (slug). Los campos que no vienen no se pisan.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveSubjectsBody"
      responses:
        "200":
          description: Materias guardadas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveSummary"
        "400":
          description: Enviá un arreglo de materias
        "401":
          description: No estás autenticado
        "404":
          description: Carrera no encontrada

  /careers/{id}/graph:
    get:
      tags:
        - Careers
      summary: Devuelve el grafo del plan de estudios
      description: "Público. Si se envía la cookie de sesión, la respuesta incluye las stats y estados según tu progreso."
      security: []
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Grafo de nodos y aristas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphData"
        "404":
          description: Carrera no encontrada

  /careers/{id}/parse-official:
    post:
      tags:
        - Careers
      summary: Parsea un PDF del plan oficial (multipart, campo file)
      description: Se usa para detectar materias nuevas del plan de estudios.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Materias extraídas del PDF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParseOfficialResponse"
        "400":
          description: Enviá el PDF en el campo 'file' o el parseo falló
        "401":
          description: No estás autenticado

  /careers/{id}/parse-correlativas:
    post:
      tags:
        - Careers
      summary: Parsea el PDF de correlatividades y las empareja con la carrera
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Correlatividades reconocidas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParseCorrelativasResponse"
        "400":
          description: Enviá el PDF en el campo 'file'
        "401":
          description: No estás autenticado
        "404":
          description: Carrera no encontrada

  /careers/{id}/correlativas:
    post:
      tags:
        - Careers
      summary: Guarda (mergea) SOLO el campo requires de las materias
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveCorrelativasBody"
      responses:
        "200":
          description: Correlatividades guardadas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveSummary"
        "400":
          description: Enviá un arreglo de materias
        "401":
          description: No estás autenticado
        "404":
          description: Carrera no encontrada

  /careers/{id}/publish:
    post:
      tags:
        - Careers
      summary: Publica una carrera (status → published)
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Carrera publicada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Career"
        "401":
          description: No estás autenticado
        "404":
          description: Carrera no encontrada

  /careers/{id}/chat:
    post:
      tags:
        - Careers
      summary: Orientador académico por IA basado en el plan real
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatBody"
      responses:
        "200":
          description: Respuesta del orientador
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "400":
          description: Enviá un prompt
        "401":
          description: No estás autenticado
        "404":
          description: Carrera no encontrada
        "503":
          description: No hay proveedor de IA configurado

  /careers/{id}:
    patch:
      tags:
        - Careers
      summary: Actualiza los datos de una carrera (nombre, color, créditos…)
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCareerBody"
      responses:
        "200":
          description: Carrera actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Career"
        "400":
          description: El nombre de la carrera no puede estar vacío
        "401":
          description: No estás autenticado
        "404":
          description: Carrera no encontrada
    delete:
      tags:
        - Careers
      summary: Elimina una carrera y todas sus materias
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Carrera eliminada
          content:
            application/json:
              example:
                deleted: Licenciatura en Algo
                deletedId: 507f1f77bcf86cd799439011
        "401":
          description: No estás autenticado
        "404":
          description: Carrera no encontrada

  /progress/parse-history:
    post:
      tags:
        - Progress
      summary: Parsea un PDF del historial académico (multipart, campo file)
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Progreso detectado en el PDF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParseHistoryResponse"
        "400":
          description: Enviá el PDF en el campo 'file'
        "401":
          description: No estás autenticado

  /progress:
    post:
      tags:
        - Progress
      summary: Guarda (upsert por materia) el progreso del usuario
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveProgressBody"
      responses:
        "200":
          description: Progreso guardado
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved:
                    type: number
                    example: 12
        "400":
          description: Enviá careerId y un arreglo de entradas
        "401":
          description: No estás autenticado

  /progress/me:
    get:
      tags:
        - Progress
      summary: Obtiene el progreso del usuario autenticado
      security:
        - cookieAuth: []
      parameters:
        - name: careerId
          in: query
          required: false
          schema:
            type: string
          description: Filtra el progreso por carrera (opcional)
      responses:
        "200":
          description: Progreso del usuario + resumen de créditos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressBundle"
        "401":
          description: No estás autenticado

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
      description: JWT de sesión fijado por POST /users/login o POST /users

  parameters:
    nickName:
      name: nickName
      in: path
      required: true
      schema:
        type: string
      description: Identificador único del usuario
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: ID (Mongo ObjectId) de la carrera

  schemas:
    User:
      type: object
      properties:
        _id:
          type: string
        nickName:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      description: La contraseña nunca se devuelve en las respuestas.

    LoginBody:
      type: object
      required: [nickName, password]
      properties:
        nickName:
          type: string
        password:
          type: string

    CreateUserBody:
      type: object
      required: [nickName, email, password]
      properties:
        nickName:
          type: string
          minLength: 1
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 4

    UpdateUserBody:
      type: object
      minProperties: 1
      properties:
        nickName:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 4

    Career:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        institute:
          type: string
        color:
          type: string
        planResolution:
          type: string
        ruleCode:
          type: string
        durationYears:
          type: number
        creditsFinal:
          type: number
        creditsIntermediate:
          type: number
        intermediateTitle:
          type: string
          nullable: true
        status:
          type: string
          enum: [draft, published]
        ownerId:
          type: string
        subjectCount:
          type: number
        reused:
          type: boolean
          description: true cuando la creación devolvió una carrera existente
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateCareerBody:
      type: object
      required: [name]
      properties:
        name:
          type: string
        institute:
          type: string
        color:
          type: string
        planResolution:
          type: string
        ruleCode:
          type: string
        durationYears:
          type: number
        creditsFinal:
          type: number
        creditsIntermediate:
          type: number

    UpdateCareerBody:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
        institute:
          type: string
        color:
          type: string
        planResolution:
          type: string
        ruleCode:
          type: string
        durationYears:
          type: number
        creditsFinal:
          type: number
        creditsIntermediate:
          type: number

    SubjectKind:
      type: string
      enum: [Materia, ACA, AU, OTRA]

    SubjectStatus:
      type: string
      enum: [Aprobada, Regular, Cursando, Pendiente]

    Hours:
      type: object
      properties:
        his:
          type: number
        hit:
          type: number
        hite:
          type: number
        hip:
          type: number
        htat:
          type: number
        ht:
          type: number

    Subject:
      type: object
      properties:
        _id:
          type: string
        careerId:
          type: string
        code:
          type: string
        name:
          type: string
        slug:
          type: string
        year:
          type: number
          nullable: true
        cuatrimestre:
          type: number
          nullable: true
        duration:
          type: string
          enum: [C, A, TF]
        hours:
          $ref: "#/components/schemas/Hours"
        credits:
          type: number
        kind:
          $ref: "#/components/schemas/SubjectKind"
        generic:
          type: string
          nullable: true
        trayecto:
          type: string
          nullable: true
        optional:
          type: boolean
        intermediate:
          type: boolean
        requires:
          type: array
          items:
            type: string

    SubjectIn:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        year:
          type: number
          nullable: true
        cuatrimestre:
          type: number
          nullable: true
        duration:
          type: string
          enum: [C, A, TF]
        hours:
          $ref: "#/components/schemas/Hours"
        credits:
          type: number
        kind:
          $ref: "#/components/schemas/SubjectKind"
        generic:
          type: string
          nullable: true
        trayecto:
          type: string
          nullable: true
        optional:
          type: boolean
        intermediate:
          type: boolean
        requires:
          type: array
          items:
            type: string

    SaveSubjectsBody:
      type: object
      required: [subjects]
      properties:
        subjects:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SubjectIn"
        intermediateTitle:
          type: string
          nullable: true
        creditsFinal:
          type: number
        creditsIntermediate:
          type: number

    SaveSummary:
      type: object
      properties:
        saved:
          type: number
        total:
          type: number

    CorrelativasRow:
      type: object
      properties:
        num:
          type: number
        parsedCode:
          type: string
        name:
          type: string
        matched:
          type: boolean
        dbCode:
          type: string
          nullable: true
        dbName:
          type: string
          nullable: true
        confidence:
          type: string
          enum: [exact, compact, fuzzy, null]
          nullable: true
        requires:
          type: array
          items:
            type: string

    ParseCorrelativasResponse:
      type: object
      properties:
        sourceKind:
          type: string
        total:
          type: number
        careerSubjects:
          type: number
        matchedCount:
          type: number
        partial:
          type: boolean
        subjects:
          type: array
          items:
            $ref: "#/components/schemas/CorrelativasRow"
        unresolved:
          type: array
          items:
            $ref: "#/components/schemas/CorrelativasRow"

    SaveCorrelativasBody:
      type: object
      required: [subjects]
      properties:
        subjects:
          type: array
          minItems: 1
          items:
            type: object
            required: [name]
            properties:
              code:
                type: string
              name:
                type: string
              requires:
                type: array
                items:
                  type: string

    ParsedSubject:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        year:
          type: number
          nullable: true
        cuatrimestre:
          type: number
          nullable: true
        duration:
          type: string
          enum: [C, A, TF]
        credits:
          type: number
        kind:
          $ref: "#/components/schemas/SubjectKind"
        optional:
          type: boolean
        intermediate:
          type: boolean
        status:
          $ref: "#/components/schemas/SubjectStatus"
        nota:
          type: number
          nullable: true
        fecha:
          type: string
          format: date
          nullable: true
        origen:
          type: string
          nullable: true

    ParseOfficialResponse:
      type: object
      properties:
        sourceKind:
          type: string
        subjects:
          type: array
          items:
            $ref: "#/components/schemas/ParsedSubject"
        detectedCount:
          type: number
        intermediateTitle:
          type: string
          nullable: true
        creditsFinal:
          type: number
        creditsIntermediate:
          type: number

    ParseHistoryResponse:
      type: object
      properties:
        sourceKind:
          type: string
        careerHint:
          type: string
          nullable: true
        subjects:
          type: array
          items:
            $ref: "#/components/schemas/ParsedSubject"
        detectedCount:
          type: number

    ProgressIn:
      type: object
      required: [subjectCode]
      properties:
        subjectCode:
          type: string
        status:
          $ref: "#/components/schemas/SubjectStatus"
        nota:
          type: number
          nullable: true
        fecha:
          type: string
          format: date
          nullable: true
        origen:
          type: string
          nullable: true
        extraRequires:
          type: array
          items:
            type: string

    SaveProgressBody:
      type: object
      required: [careerId, entries]
      properties:
        careerId:
          type: string
        entries:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ProgressIn"

    Progress:
      allOf:
        - $ref: "#/components/schemas/ProgressIn"
        - type: object
          properties:
            _id:
              type: string
            userId:
              type: string
            careerId:
              type: string

    ProgressSummary:
      type: object
      nullable: true
      properties:
        creditsTotal:
          type: number
        creditsAprobados:
          type: number
        aprobadas:
          type: number
        total:
          type: number

    ProgressBundle:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/Progress"
        summary:
          $ref: "#/components/schemas/ProgressSummary"

    GraphNode:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
        year:
          type: number
          nullable: true
        cuatrimestre:
          type: number
          nullable: true
        duration:
