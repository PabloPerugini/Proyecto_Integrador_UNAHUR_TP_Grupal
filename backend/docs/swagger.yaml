openapi: 3.0.3
info:
  title: Gradify API
  description: API REST del Proyecto Integrador UNAHUR (nueva arquitectura: universidades, carreras, planes de estudio y progreso por usuario con JWT).
  version: 2.0.0
servers:
  - url: http://localhost:3000
tags:
  - name: System
    description: Raíz y salud
  - name: Careers
    description: Catálogo de carreras (lectura pública; mutaciones solo ADMIN)
  - name: StudyPlans
    description: Planes de estudio del usuario + grafo y sugerencias
  - name: PlanImports
    description: Importación de PDFs (preview sin guardar + confirm)
  - name: UserStudyPlans
    description: Inscripciones y progreso del usuario
  - name: Progress
    description: Lector de historial académico en PDF
  - name: Users
    description: Registro, login JWT y administración
  - name: Universities
    description: Universidades (lectura pública; mutaciones solo ADMIN)
  - name: AcademicUnits
    description: Unidades académicas (lectura pública; mutaciones solo ADMIN)
security:
  - bearerAuth: []
paths:
  /:
    get:
      tags:
        - System
      summary: Raíz de la API (nombre, estado, docs)
      security: []
      responses:
        "200":
          description: Info de la API

  /health:
    get:
      tags:
        - System
      summary: Verifica que la API esté viva
      security: []
      responses:
        "200":
          description: Servicio OK
          content:
            application/json:
              example:
                status: ok

  /careers:
    get:
      tags:
        - Careers
      summary: Lista el catálogo de carreras (público)
      security: []
      responses:
        "200":
          description: Lista de carreras
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Career"
    post:
      tags:
        - Careers
      summary: Crea una carrera (solo ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCareerBody"
      responses:
        "201":
          description: Carrera creada
        "401":
          description: Sin autenticación
        "403":
          description: Sin rol ADMIN

  /careers/{id}:
    get:
      tags:
        - Careers
      summary: Detalle de una carrera (público)
      security: []
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Carrera
        "404":
          description: Carrera no encontrada
    patch:
      tags:
        - Careers
      summary: Actualiza una carrera (solo ADMIN)
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Carrera actualizada
    delete:
      tags:
        - Careers
      summary: Borra una carrera (solo ADMIN)
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Carrera eliminada

  /plan-imports/preview:
    post:
      tags:
        - PlanImports
      summary: Parsea un PDF sin guardar (multipart, campo file; con cota IA)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Materias extraídas + correlativasTexto
          content:
            application/json:
              example:
                sourceKind: oficial
                detectedCount: 19
                subjects: []
                aiFallback: false
                aiProvider: null
        "400":
          description: Sin archivo o no es PDF
        "422":
          description: Sin materias detectables

  /plan-imports/confirm:
    post:
      tags:
        - PlanImports
      summary: Guarda el plan (resuelve correlativas a prerequisites, anti-ciclos)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileHash, careerId, name, fileName, subjects]
              properties:
                fileHash:
                  type: string
                careerId:
                  type: string
                name:
                  type: string
                fileName:
                  type: string
                subjects:
                  type: array
                  items:
                    type: object
      responses:
        "201":
          description: Plan guardado
          content:
            application/json:
              example:
                message: Plan guardado correctamente
                saved: 19
                prerequisitesResolved: 15
                prerequisitesReview: []
                prerequisitesDropped: []
        "400":
          description: Ciclo detectado (no se guarda nada) o datos inválidos
        "409":
          description: Ese PDF ya se guardó en esa carrera

  /plan-imports:
    get:
      tags:
        - PlanImports
      summary: Historial de importaciones del usuario
      responses:
        "200":
          description: Lista de importaciones

  /plan-imports/{importId}:
    get:
      tags:
        - PlanImports
      summary: Detalle de una importación
      parameters:
        - name: importId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Importación
        "404":
          description: No encontrada

  /study-plans:
    get:
      tags:
        - StudyPlans
      summary: Mis planes (ADMIN ve todos)
      responses:
        "200":
          description: Lista de planes
    post:
      tags:
        - StudyPlans
      summary: Crea un plan personal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          description: Plan creado

  /study-plans/{id}:
    get:
      tags:
        - StudyPlans
      summary: Detalle del plan (dueño o ADMIN)
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Plan
        "404":
          description: No encontrado
    patch:
      tags:
        - StudyPlans
      summary: Actualiza el plan (dueño o ADMIN)
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Plan actualizado
    delete:
      tags:
        - StudyPlans
      summary: Borra el plan en cascada (materias, inscripciones, progreso, importaciones). 409 si hay otros inscriptos y no sos ADMIN
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Plan eliminado
          content:
            application/json:
              example:
                message: Plan de estudio eliminado correctamente
                removed:
                  subjects: 19
                  enrollments: 1
                  progress: 1
                  imports: 1
        "409":
          description: Otros estudiantes lo usan

  /study-plans/{id}/subjects:
    get:
      tags:
        - StudyPlans
      summary: Materias del plan con prerequisites (base de tablero y grafo)
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Lista de materias del plan
    post:
      tags:
        - StudyPlans
      summary: Agrega una materia al plan (dueño o ADMIN)
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "201":
          description: Materia agregada

  /study-plans/{id}/subjects/{subjectId}:
    get:
      tags:
        - StudyPlans
      summary: Detalle de una materia del plan
      parameters:
        - $ref: "#/components/parameters/id"
        - name: subjectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Materia del plan
    patch:
      tags:
        - StudyPlans
      summary: Actualiza materia (incluye prerequisites, con anti-ciclos)
      parameters:
        - $ref: "#/components/parameters/id"
        - name: subjectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Materia actualizada
    delete:
      tags:
        - StudyPlans
      summary: Elimina materia (409 si es correlativa de otra o tiene progreso)
      parameters:
        - $ref: "#/components/parameters/id"
        - name: subjectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Materia eliminada
        "409":
          description: Referenciada o con progreso

  /study-plans/{id}/graph:
    get:
      tags:
        - StudyPlans
      summary: Grafo de correlatividades (nodos, aristas, disponibles, camino crítico, RN04)
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Grafo del plan

  /study-plans/{id}/sugerencias:
    get:
      tags:
        - StudyPlans
      summary: Sugerencias de inscripción AR-3 (C1–C6, mensajes R0–R6)
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Sugerencias

  /user-study-plans:
    get:
      tags:
        - UserStudyPlans
      summary: Mis inscripciones a planes
      responses:
        "200":
          description: Inscripciones
    post:
      tags:
        - UserStudyPlans
      summary: Inscribirme a un plan (propio o publicado oficial)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studyPlanId]
              properties:
                studyPlanId:
                  type: string
      responses:
        "201":
          description: Inscripción creada
        "404":
          description: Plan no disponible
        "409":
          description: Ya inscripto

  /user-study-plans/{studyPlanId}:
    delete:
      tags:
        - UserStudyPlans
      summary: Desinscribirme de un plan
      parameters:
        - name: studyPlanId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Inscripción eliminada

  /user-study-plans/{userStudyPlanId}/progress:
    get:
      tags:
        - UserStudyPlans
      summary: Progreso guardado de mi inscripción
      parameters:
        - name: userStudyPlanId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lista de avances (PENDIENTE/CURSANDO/REGULARIZADA/APROBADA + nota)

  /user-study-plans/{userStudyPlanId}/progress/{planSubjectId}:
    put:
      tags:
        - UserStudyPlans
      summary: Guarda/avanza el estado de una materia
      parameters:
        - name: userStudyPlanId
          in: path
          required: true
          schema:
            type: string
        - name: planSubjectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [PENDIENTE, CURSANDO, REGULARIZADA, APROBADA]
                grade:
                  type: number
      responses:
        "200":
          description: Progreso guardado

  /progress/parse-history:
    post:
      tags:
        - Progress
      summary: Lee un PDF de historial académico (multipart, campo file)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Avances detectados en el PDF

  /users/register:
    post:
      tags:
        - Users
      summary: Registro (nickName, firstName, lastName, email, password min 6; rol siempre USUARIO)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nickName, firstName, lastName, email, password]
              properties:
                nickName:
                  type: string
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                password:
                  type: string
      responses:
        "201":
          description: Usuario creado
        "400":
          description: Datos inválidos
        "409":
          description: Nick o email duplicado

  /users/login:
    post:
      tags:
        - Users
      summary: Login (devuelve JWT Bearer + cookie httpOnly)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nickName, password]
              properties:
                nickName:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Token JWT
        "401":
          description: Credenciales inválidas

  /users/logout:
    post:
      tags:
        - Users
      summary: Cierra sesión (limpia cookie)
      responses:
        "200":
          description: Sesión cerrada

  /users/me:
    get:
      tags:
        - Users
      summary: Mi perfil
      responses:
        "200":
          description: Usuario actual

  /users:
    get:
      tags:
        - Users
      summary: Lista usuarios (solo ADMIN)
      responses:
        "200":
          description: Lista de usuarios
        "403":
          description: Sin rol ADMIN

  /users/{nickName}:
    get:
      tags:
        - Users
      summary: Ver usuario (dueño o ADMIN)
      parameters:
        - name: nickName
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Usuario
    patch:
      tags:
        - Users
      summary: Actualiza usuario (dueño o ADMIN)
      parameters:
        - name: nickName
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Usuario actualizado
    delete:
      tags:
        - Users
      summary: Elimina usuario (dueño o ADMIN)
      parameters:
        - name: nickName
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Usuario eliminado

  /universities:
    get:
      tags:
        - Universities
      summary: Lista universidades (público)
      security: []
      responses:
        "200":
          description: Lista de universidades
    post:
      tags:
        - Universities
      summary: Crea universidad (solo ADMIN)
      responses:
        "201":
          description: Universidad creada

  /universities/{id}:
    get:
      tags:
        - Universities
      summary: Detalle de universidad (público)
      security: []
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Universidad
    patch:
      tags:
        - Universities
      summary: Actualiza universidad (solo ADMIN)
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Universidad actualizada
    delete:
      tags:
        - Universities
      summary: Borra universidad (solo ADMIN)
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Universidad eliminada

  /academic-units:
    get:
      tags:
        - AcademicUnits
      summary: Lista unidades académicas (público)
      security: []
      responses:
        "200":
          description: Lista de unidades
    post:
      tags:
        - AcademicUnits
      summary: Crea unidad académica (solo ADMIN)
      responses:
        "201":
          description: Unidad creada

  /academic-units/{id}:
    get:
      tags:
        - AcademicUnits
      summary: Detalle de unidad académica (público)
      security: []
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Unidad académica
    patch:
      tags:
        - AcademicUnits
      summary: Actualiza unidad (solo ADMIN)
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Unidad actualizada
    delete:
      tags:
        - AcademicUnits
      summary: Borra unidad (solo ADMIN)
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Unidad eliminada

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: ID (Mongo ObjectId)

  schemas:
    Career:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        institute:
          type: string
        color:
          type: string
        status:
          type: string
          enum: [draft, published]
    CreateCareerBody:
      type: object
      required: [name]
      properties:
        name:
          type: string
        institute:
          type: string
        durationYears:
          type: number
