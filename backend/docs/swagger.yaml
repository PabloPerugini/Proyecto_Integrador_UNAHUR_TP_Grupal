openapi: 3.0.3
info:
  title: UNAHUR TP - API
  description: API REST del Proyecto Integrador UNAHUR. Documenta carreras, plan de estudios y progreso del alumno.
  version: 1.0.0
servers:
  - url: http://localhost:3000
tags:
  - name: Health
    description: Estado de la API
  - name: Careers
    description: Carreras y plan de estudios
  - name: Progress
    description: Progreso del alumno
paths:
  /health:
    get:
      tags:
        - Health
      summary: Verifica que la API esté viva
      responses:
        "200":
          description: Servicio OK
          content:
            application/json:
              example:
                status: ok

  /careers:
    get:
      tags:
        - Careers
      summary: Lista las carreras (filtrable por status)
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [draft, published]
      responses:
        "200":
          description: Lista de carreras
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Career"
    post:
      tags:
        - Careers
      summary: Crea una carrera
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCareerBody"
      responses:
        "201":
          description: Carrera creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Career"
        "400":
          description: Validación fallida

  /careers/{id}/subjects:
    get:
      tags:
        - Careers
      summary: Lista las materias de una carrera
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Lista de materias
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subject"
        "400":
          description: ID inválido (CastError → envelope 400)
        "404":
          description: Carrera no encontrada
    post:
      tags:
        - Careers
      summary: Guarda/mergea materias de una carrera
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subjects:
                  type: array
                  items:
                    $ref: "#/components/schemas/SubjectIn"
      responses:
        "200":
          description: Materias guardadas
          content:
            application/json:
              example:
                saved: 12
                total: 40
        "400":
          description: Arreglo vacío o ID inválido
        "404":
          description: Carrera no encontrada

  /careers/{id}/graph:
    get:
      tags:
        - Careers
      summary: Devuelve el grafo del plan de estudios (incluye el progreso del navegador)
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/xUserId"
      responses:
        "200":
          description: Grafo de nodos y aristas
        "401":
          description: Falta header x-user-id (withDeviceId)
          content:
            application/json:
              example:
                success: false
                error:
                  message: "Falta identificador de sesión (x-user-id)"
        "404":
          description: Carrera no encontrada

  /careers/{id}/sugerencias:
    get:
      tags:
        - Careers
      summary: Sugerencias de inscripción AR-3 (R0–R6) desde el historial
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/xUserId"
      responses:
        "200":
          description: Materias A/B, disponibles, finales, comunes y mensajes
        "401":
          description: Falta header x-user-id (withDeviceId)
          content:
            application/json:
              example:
                success: false
                error:
                  message: "Falta identificador de sesión (x-user-id)"
        "404":
          description: Carrera no encontrada

  /careers/{id}/parse-official:
    post:
      tags:
        - Careers
      summary: Parsea un PDF del plan oficial (multipart, campo file)
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Materias extraídas del PDF
          content:
            application/json:
              example:
                sourceKind: official
                detectedCount: 3
                subjects: []
                aiFallback: false
                aiProvider: null
        "400":
          description: Falta campo file, no es PDF (%PDF-) o supera 10 MB (upload.js + isPdfBuffer)

  /careers/{id}/publish:
    post:
      tags:
        - Careers
      summary: Publica una carrera pasándola a status published
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Carrera publicada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Career"
        "400":
          description: ID inválido
        "404":
          description: Carrera no encontrada

  /progress/parse-history:
    post:
      tags:
        - Progress
      summary: Parsea un PDF del historial académico (multipart, campo file)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Progreso detectado en el PDF
        "400":
          description: Falta campo file, no es PDF o supera 10 MB

  /progress:
    post:
      tags:
        - Progress
      summary: Guarda el progreso del alumno (masivo por carrera)
      parameters:
        - $ref: "#/components/parameters/xUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressSaveBody"
            example:
              careerId: "68e237f52ff8cebc00ef345d"
              entries:
                - subjectCode: "MAT-101"
                  status: "Aprobada"
                  nota: 8
                - subjectCode: "FIS-102"
                  status: "Regular"
      responses:
        "200":
          description: Progreso guardado
          content:
            application/json:
              example:
                saved: 2
        "400":
          description: Falta careerId/entries o entrada inválida (subjectCode + estado válido requeridos)
        "401":
          description: Falta header x-user-id (withDeviceId)

  /progress/me:
    get:
      tags:
        - Progress
      summary: Obtiene el progreso del navegador actual
      parameters:
        - $ref: "#/components/parameters/xUserId"
        - name: careerId
          in: query
          required: false
          schema:
            type: string
          description: Filtra por carrera; si se envía, la respuesta incluye summary de créditos
      responses:
        "200":
          description: Progreso del navegador ({ entries, summary })
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressMe"
        "401":
          description: Falta header x-user-id (withDeviceId)

  /:
    get:
      tags:
        - System
      summary: Raíz de la API (nombre, estado, docs)
      responses:
        "200":
          description: Info de la API

  /careers/{id}/parse-correlativas:
    post:
      tags:
        - Careers
      summary: Parsea un PDF de correlativas (multipart, campo file)
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Matching contra materias + sugerencias IA (aiSuggested/aiReview)
        "400":
          description: Falta campo file, no es PDF o supera 10 MB
        "404":
          description: Carrera no encontrada

  /careers/{id}/correlativas:
    post:
      tags:
        - Careers
      summary: Guarda correlativas (solo códigos existentes, sin ciclos)
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subjects:
                  type: array
                  items:
                    type: object
      responses:
        "200":
          description: Correlativas guardadas (informa descartes en dropped)
        "400":
          description: Ciclo detectado (no se guarda nada) o arreglo vacío
        "404":
          description: Carrera no encontrada

  /careers/{id}:
    patch:
      tags:
        - Careers
      summary: Actualiza datos de una carrera
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Carrera actualizada
        "400":
          description: ID inválido o nombre vacío
        "404":
          description: Carrera no encontrada
    delete:
      tags:
        - Careers
      summary: Borra una carrera con sus materias y avances
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Carrera eliminada
        "400":
          description: ID inválido
        "404":
          description: Carrera no encontrada

  /users/login:
    post:
      tags:
        - Users (legado, sin UI)
      summary: "[LEGADO congelado] Login JWT — existe en código, ninguna pantalla lo usa (Opción A: no ampliar, no exponer en UI)"
      responses:
        "200":
          description: Token JWT

  /users/register:
    post:
      tags:
        - Users (legado, sin UI)
      summary: "[LEGADO congelado] Registro — existe en código, ninguna pantalla lo usa (Opción A: no ampliar, no exponer en UI)"
      responses:
        "201":
          description: Usuario creado

components:
  parameters:
    xUserId:
      name: x-user-id
      in: header
      required: true
      schema:
        type: string
      description: Clave local por navegador (localStorage). La genera el frontend. Sin ella → 401 (withDeviceId). No es sesión ni token.
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: ID (Mongo ObjectId) de la carrera

  schemas:
    Career:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        institute:
          type: string
        color:
          type: string
        planResolution:
          type: string
        ruleCode:
          type: string
        durationYears:
          type: number
        creditsFinal:
          type: number
        creditsIntermediate:
          type: number
        status:
          type: string
          enum: [draft, published]
        subjectCount:
          type: number
    CreateCareerBody:
      type: object
      required: [name]
      properties:
        name:
          type: string
        institute:
          type: string
        color:
          type: string
        planResolution:
          type: string
        ruleCode:
          type: string
        durationYears:
          type: number
        creditsFinal:
          type: number
        creditsIntermediate:
          type: number
    Subject:
      type: object
      properties:
        _id:
          type: string
        careerId:
          type: string
        code:
          type: string
        name:
          type: string
        year:
          type: number
        cuatrimestre:
          type: number
        duration:
          type: string
          enum: [C, A, TF]
        hours:
          type: object
          additionalProperties:
            type: number
        credits:
          type: number
        kind:
          type: string
        optional:
          type: boolean
        requires:
          type: array
          items:
            type: string
    SubjectIn:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        year:
          type: number
        cuatrimestre:
          type: number
        duration:
          type: string
        hours:
          type: object
          additionalProperties:
            type: number
        credits:
          type: number
        kind:
          type: string
        optional:
          type: boolean
        requires:
          type: array
          items:
            type: string
    ProgressIn:
      type: object
      required: [subjectCode]
      properties:
        subjectCode:
          type: string
        status:
          type: string
          enum: [Aprobada, Regular, Cursando, Pendiente]
        nota:
          type: number
        fecha:
          type: string
          format: date
        origen:
          type: string
        extraRequires:
          type: array
          items:
            type: string
    ProgressSaveBody:
      type: object
      required: [careerId, entries]
      properties:
        careerId:
          type: string
          description: ObjectId de la carrera (requerido, va en el body)
        entries:
          type: array
          items:
            $ref: "#/components/schemas/ProgressIn"
    ProgressMe:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/Progress"
        summary:
          type: object
          nullable: true
          properties:
            creditsTotal:
              type: number
            creditsAprobados:
              type: number
            aprobadas:
              type: number
            total:
              type: number
    Progress:
      allOf:
        - $ref: "#/components/schemas/ProgressIn"
        - type: object
          properties:
            _id:
              type: string
            userId:
              type: string
            careerId:
              type: string